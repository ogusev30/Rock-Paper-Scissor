<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deneme Sayfası — Taş Kağıt Makas</title>
<style>
  :root { --bg: #f6f5f2; --card: #fff; --ink: #1f1e1d; --muted: #6b6862; --line: #e4e1db;
          --rock: #c2410c; --paper: #2563eb; --scissors: #16a34a; --danger: #dc2626; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1200px; margin: 0 auto; padding: 18px 16px 40px; }
  h1 { font-size: 20px; margin: 0 0 2px; }
  .sub { color: var(--muted); margin: 0 0 14px; }
  .status { padding: 10px 14px; border-radius: 10px; background: #fff7ed; border: 1px solid #fed7aa; margin-bottom: 14px; }
  .status.err { background: #fef2f2; border-color: #fecaca; color: var(--danger); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 16px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
  .panel h2 { font-size: 16px; margin: 0 0 2px; }
  .panel .meta { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  canvas.view { width: 100%; aspect-ratio: 4 / 3; background: #111; border-radius: 10px; display: block; }
  .bars { margin-top: 10px; display: grid; gap: 6px; }
  .bar { display: grid; grid-template-columns: 60px 1fr 46px; align-items: center; gap: 8px; font-size: 14px; }
  .track { height: 12px; background: #eceae5; border-radius: 999px; overflow: hidden; }
  .track i { display: block; height: 100%; width: 0; border-radius: 999px; transition: width .15s; }
  .bar span:last-child { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  .crop { display: flex; gap: 10px; align-items: center; margin-top: 14px; color: var(--muted); font-size: 13px; }
  .crop canvas { width: 96px; height: 96px; border-radius: 8px; background: #111; }
  video { display: none; }
</style>
</head>
<body>
<main>
  <h1>Deneme Sayfası</h1>
  <p class="sub">Elini kameraya göster: taş, kağıt veya makas yap. Her model kendi panelinde tahmin eder.</p>
  <div class="status" id="status">Yükleniyor…</div>
  <div class="grid" id="panels"></div>
  <div class="crop"><canvas id="crop" width="224" height="224"></canvas>
    <div>Modellerin gördüğü görüntü: MediaPipe'ın bulduğu el, eğitimdekiyle aynı kuralla kırpılmış (224×224).</div></div>
  <video id="video" autoplay playsinline muted></video>
</main>

<script type="module">
import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const COLORS = { rock: "--rock", paper: "--paper", scissors: "--scissors" };
const SHOW = ["rock", "paper", "scissors"];          // çubuk sırası: Taş, Kağıt, Makas
const TR = { rock: "Taş", paper: "Kağıt", scissors: "Makas" };
const video = document.getElementById("video");
const statusEl = document.getElementById("status");
const crop = document.getElementById("crop"), cropCtx = crop.getContext("2d");
let landmarker, models = [], panels = {}, smooth = {}, box = null, busy = false, lastSent = 0;

function setStatus(text, err = false) {
  statusEl.hidden = !text; statusEl.textContent = text || ""; statusEl.classList.toggle("err", err);
}
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

async function loadModels() {
  models = await (await fetch("models", { cache: "no-store" })).json();
  const root = document.getElementById("panels");
  root.innerHTML = "";
  for (const m of models) {
    const el = document.createElement("div");
    el.className = "panel";
    el.innerHTML = `<h2>${m.name === "model_a" ? "Model A" : "Model B"}: ${m.model}</h2>
      <div class="meta">Test macro F1: ${m.test_macro_f1.toFixed(3)}</div>
      <canvas class="view" width="640" height="480"></canvas>
      <div class="bars">${SHOW.map((c) => `<div class="bar"><span>${TR[c]}</span>
        <div class="track"><i data-c="${c}" style="background:var(${COLORS[c]})"></i></div><span data-p="${c}">–</span></div>`).join("")}</div>`;
    root.appendChild(el);
    panels[m.name] = { canvas: el.querySelector("canvas"), el };
  }
}

// Eğitimdeki kırpma kuralı (tools/crop_hands.py): 21 noktanın kutusu → uzun kenar × crop_pad kare
function squareBox(lms, w, h, pad) {
  const xs = lms.map((p) => p.x * w), ys = lms.map((p) => p.y * h);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const side = Math.max(x1 - x0, y1 - y0) * pad;
  return { x: (x0 + x1) / 2 - side / 2, y: (y0 + y1) / 2 - side / 2, side };
}

async function sendCrop() {
  if (busy || !box || performance.now() - lastSent < 120) return;
  busy = true; lastSent = performance.now();
  cropCtx.fillStyle = "#000"; cropCtx.fillRect(0, 0, 224, 224);
  cropCtx.drawImage(video, box.x, box.y, box.side, box.side, 0, 0, 224, 224);  // dışarı taşan kısım siyah kalır
  const blob = await new Promise((r) => crop.toBlob(r, "image/jpeg", 0.95));
  try {
    const res = await fetch("predict", { method: "POST", body: blob });
    const out = await res.json();
    if (!res.ok) throw new Error(out.error);
    for (const m of models) {
      const p = out[m.name]?.probs; if (!p) continue;
      const prev = smooth[m.name] || p;
      smooth[m.name] = p.map((v, i) => 0.5 * v + 0.5 * prev[i]);   // titremesin diye hafif yumuşatma
    }
  } catch (e) { setStatus("Tahmin alınamadı: " + e.message, true); }
  busy = false;
}

function draw() {
  const W = video.videoWidth, H = video.videoHeight;
  for (const m of models) {
    const { canvas, el } = panels[m.name];
    if (canvas.width !== W) { canvas.width = W; canvas.height = H; }
    const ctx = canvas.getContext("2d");
    ctx.save(); ctx.translate(W, 0); ctx.scale(-1, 1); ctx.drawImage(video, 0, 0, W, H); ctx.restore();  // ayna görüntü
    const p = smooth[m.name];
    if (!box) {
      ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fillRect(0, H / 2 - 30, W, 60);
      ctx.fillStyle = "#fff"; ctx.font = `600 ${Math.round(W / 22)}px system-ui`; ctx.textAlign = "center";
      ctx.fillText("Elini kameraya göster", W / 2, H / 2 + 10);
    } else if (p) {
      const best = p.indexOf(Math.max(...p)), cls = m.classes[best];
      const x = W - box.x - box.side, color = css(COLORS[cls]);   // kutu ayna görüntüye göre
      ctx.lineWidth = Math.max(3, W / 160); ctx.strokeStyle = color; ctx.strokeRect(x, box.y, box.side, box.side);
      const label = `${TR[cls]} %${Math.round(p[best] * 100)}`;
      ctx.font = `700 ${Math.round(W / 20)}px system-ui`; ctx.textAlign = "left";
      const tw = ctx.measureText(label).width + 20, th = W / 20 + 14, ty = Math.max(0, box.y - th);
      ctx.fillStyle = color; ctx.fillRect(x - ctx.lineWidth / 2, ty, tw, th);
      ctx.fillStyle = "#fff"; ctx.fillText(label, x + 10 - ctx.lineWidth / 2, ty + th - 10);
    }
    for (const c of SHOW) {
      const v = p && box ? p[m.classes.indexOf(c)] : 0;
      el.querySelector(`i[data-c="${c}"]`).style.width = `${v * 100}%`;
      el.querySelector(`span[data-p="${c}"]`).textContent = p && box ? `%${Math.round(v * 100)}` : "–";
    }
  }
}

function loop() {
  if (video.readyState >= 2) {
    const res = landmarker.detectForVideo(video, performance.now());
    box = res.landmarks.length
      ? squareBox(res.landmarks[0], video.videoWidth, video.videoHeight, models[0]?.crop_pad ?? 1.4) : null;
    if (box) sendCrop();
    draw();
  }
  requestAnimationFrame(loop);
}

async function start() {
  try {
    await loadModels();
    if (!models.length) { setStatus("Henüz eğitilmiş model yok. Notebook ONNX dosyasını yazınca sayfayı yenile.", true); return; }
    setStatus("El tespit modeli yükleniyor…");
    const fileset = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    landmarker = await HandLandmarker.createFromOptions(fileset, {
      baseOptions: { modelAssetPath: "hand_landmarker.task", delegate: "CPU" }, runningMode: "VIDEO", numHands: 1,
    });
  } catch (e) { setStatus("Yüklenemedi: " + e.message, true); return; }
  setStatus("Kamera açılıyor…");
  try {
    video.srcObject = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    await video.play();
  } catch (e) { setStatus("Kameraya erişilemedi. Lütfen izin ver.", true); return; }
  setStatus("");
  loop();
}
start();
</script>
</body>
</html>
